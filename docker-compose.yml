version: "3.8"

services:
  bot:
    build: .
    container_name: hotline-bot
    restart: unless-stopped
    ports:
      # Дашборд руководителя публикуем ТОЛЬКО на loopback хоста (наружу порт не
      # экспонируется). Для доступа извне используйте reverse-proxy с TLS.
      - "127.0.0.1:${MANAGER_DASHBOARD_PORT:-8081}:${MANAGER_DASHBOARD_PORT:-8081}"
    env_file:
      - .env
      - .env.txt
    environment:
      # В контейнере дашборд слушает на всех интерфейсах, чтобы работал проброс
      # порта; наружу порт всё равно не публикуется (см. ports выше). Из-за этого
      # MANAGER_DASHBOARD_KEY обязателен — без него бот не стартует (fail fast).
      MANAGER_DASHBOARD_HOST: "0.0.0.0"
      # Используем Redis для FSM-хранилища (подключается к сервису redis ниже).
      # Чтобы вернуться к памяти — закомментируйте строку REDIS_URL ниже.
      REDIS_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379/0"
    depends_on:
      - redis
    volumes:
      - ./hotline_service.db:/app/hotline_service.db
      - ./bot.log:/app/bot.log
      - ./media:/app/media
      - ./.env.txt:/app/.env.txt
      # Файл-«пульс» бота: watchdog на хосте читает его для определения зависания
      - ./.heartbeat:/app/.heartbeat
    # Healthcheck: проверяем «пульс» бота — файл .heartbeat обновляется каждые 5 секунд.
    # Если heartbeat старше 60 секунд — бот завис.
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /app/.heartbeat 2>/dev/null || echo 0) )) -lt 60"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    container_name: hotline-redis
    volumes:
      - redis-data:/data
    # Пароль обязателен: дефолтного пароля нет, compose упадёт, если REDIS_PASSWORD
    # не задан или пуст. Задаётся через REDIS_PASSWORD в .env.
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  redis-data: