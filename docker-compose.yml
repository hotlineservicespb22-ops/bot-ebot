version: "3.8"

services:
  bot:
    build: .
    container_name: hotline-bot
    restart: unless-stopped
    env_file:
      - .env
      - .env.txt
    environment:
      # Используем Redis для FSM-хранилища (подключается к сервису redis ниже).
      # Чтобы вернуться к памяти — закомментируйте строку REDIS_URL ниже.
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      - redis
    volumes:
      - ./hotline_service.db:/app/hotline_service.db
      - ./bot.log:/app/bot.log
      - ./media:/app/media
      - ./.env.txt:/app/.env.txt
      # Файл-«пульс» бота: watchdog на хосте читает его для определения зависания
      - ./.heartbeat:/app/.heartbeat
    # Healthcheck: проверяем, что контейнер жив (процесс бота). Полезен для оркестраторов.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys; sys.exit(0 if os.path.exists('/app/hotline_service.db') else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    container_name: hotline-redis
    volumes:
      - redis-data:/data
    # Опционально: задать пароль
    # command: ["redis-server", "--requirepass", "yourpassword"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  redis-data: